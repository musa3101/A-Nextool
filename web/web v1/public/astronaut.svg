<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none" className="w-full h-auto">
  <defs>
    <linearGradient id="astroVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="visorReflection" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="suitHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="astroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#astroGlow)">
    <!-- Backpack (Life support) -->
    <rect x="55" y="70" width="35" height="95" rx="14" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <rect x="58" y="85" width="10" height="25" rx="4" fill="#94a3b8"/>

    <!-- Left Leg / Boot -->
    <path d="M85 175 L70 230 C68 238 72 245 82 248 L96 250 C106 250 110 244 108 236 L105 180 Z" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>
    <path d="M72 238 C76 242 86 246 100 246" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Leg / Boot (floating bent) -->
    <path d="M125 175 L145 210 C152 222 165 224 175 218 L190 208 C198 202 198 192 190 185 L145 158 Z" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>
    <path d="M172 216 L185 206" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Body Torso -->
    <path d="M80 85 C80 75 140 75 140 85 L145 165 C145 178 75 178 75 165 Z" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>
    
    <!-- Chest control pack -->
    <rect x="95" y="105" width="30" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="103" cy="115" r="3" fill="#38bdf8"/>
    <circle cx="117" cy="115" r="3" fill="#ef4444"/>
    <line x1="102" y1="126" x2="118" y2="126" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm -->
    <path d="M78 95 C60 110 50 135 45 150 C42 160 52 165 60 158 C68 150 78 128 85 115 Z" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>
    <!-- Glove -->
    <circle cx="48" cy="155" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>

    <!-- Right Arm (reaching out toward form) -->
    <path d="M138 95 C158 105 180 120 195 130 C205 136 210 128 204 120 C190 105 168 90 148 85 Z" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>
    <!-- Glove pointing/reaching -->
    <ellipse cx="206" cy="126" rx="9" ry="7" transform="rotate(-25 206 126)" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>

    <!-- Helmet Base & Neck Ring -->
    <ellipse cx="110" cy="78" rx="28" ry="10" fill="#64748b" stroke="#334155" stroke-width="2.5"/>

    <!-- Helmet Sphere -->
    <circle cx="110" cy="62" r="34" fill="url(#suitHighlight)" stroke="#475569" stroke-width="3"/>

    <!-- Dark Visor -->
    <path d="M90 52 C90 38 130 38 130 52 C132 68 128 76 110 76 C92 76 88 68 90 52 Z" fill="url(#astroVisor)" stroke="#1e293b" stroke-width="2.5"/>
    
    <!-- Visor Cosmic Reflection Streak -->
    <path d="M96 46 C105 40 122 41 126 48 C120 54 105 50 96 46 Z" fill="url(#visorReflection)"/>
    <ellipse cx="102" cy="62" rx="4" ry="2" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>
