<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon Oficial NexTool (Sin Fondo) -->
    <link rel="icon" type="image/png" href="/icons/nextool-sinfondo.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Pantalla de Inicio / App Icon (iOS & Android) -->
    <link rel="apple-touch-icon" href="/icons/nextool-appinicio.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NexTool</title>

    <!-- Configuración PWA / Instalación en Pantalla de Inicio -->
    <meta name="apple-mobile-web-app-title" content="NexTool" />
    <meta name="application-name" content="NexTool" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B111E" />

    <!-- Metadatos de Compartición WhatsApp y Redes Sociales (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexTool" />
    <meta property="og:title" content="NexTool — Plataforma de Gestión para Negocios" />
    <meta property="og:description" content="Plataforma de gestión de galerías, presupuestos y control para negocios locales." />
    <meta property="og:url" content="https://a-nextool.pages.dev" />
    <meta property="og:image" content="https://a-nextool.pages.dev/icons/nextool-share.png" />
    <meta property="og:image:secure_url" content="https://a-nextool.pages.dev/icons/nextool-share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="923" />
    <meta property="og:image:height" content="918" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexTool — Plataforma de Gestión para Negocios" />
    <meta name="twitter:description" content="Plataforma de gestión de galerías, presupuestos y control para negocios locales." />
    <meta name="twitter:image" content="https://a-nextool.pages.dev/icons/nextool-share.png" />
    <!-- Fontshare Fonts: Satoshi (Headings/Display) & General Sans (UI/Body) -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,800,700,600,500,400&display=swap">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@700,600,500,400&display=swap">
  </head>
  <body class="bg-surface-canvas text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
